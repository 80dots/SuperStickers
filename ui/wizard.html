<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI 설정 마법사</title>
  <meta http-equiv="Content-Security-Policy"
        content="script-src 'self'; object-src 'none'; base-uri 'none'">
  <script src="/common/early-theme.js"></script>
  <link rel="stylesheet" href="/common/base.css">
  <link rel="stylesheet" href="/common/theme.css">
  <link rel="stylesheet" href="/common/aiwizard.css">
  <style>
    /* 별도 창: 모달 배경 없이 창 전체가 마법사 상자다 */
    html, body { height: 100%; background: var(--panel-bg, #fff); color: var(--fg, #222); }
    .wiz-back { position: static; inset: auto; display: block; height: 100%; padding: 0; background: transparent; }
    .wiz-box { max-width: none; height: 100%; border-radius: 0; box-shadow: none; }
    .wiz-head { display: none; }   /* 제목·닫기는 네이티브 창 타이틀바가 맡는다 */
  </style>
</head>
<body>
  <script src="/common/bridge.js"></script>
  <script src="/common/i18n.js"></script>
  <script src="/common/ollama-models.js"></script>
  <script src="/aiwizard.js"></script>
  <script src="/wizard.js"></script>
</body>
</html>
