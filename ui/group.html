<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Group</title>
  <script>
    (function () {
      var init = window.__init || {};
      document.documentElement.dataset.theme = init.theme || 'light';
    })();
  </script>
  <link rel="stylesheet" href="/common/base.css">
  <link rel="stylesheet" href="/common/theme.css">
  <link rel="stylesheet" href="/group.css">
</head>
<body>
  <div id="frame">
  <header id="ghead">
    <svg id="gicon" viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2 2h5v5H2zm7 0h5v5H9zM2 9h5v5H2zm7 0h5v5H9z" opacity="0.7"/></svg>
    <span id="gtitleText"></span>
    <button id="titleEditBtn" class="tb-btn" data-i18n-title="tt.editTitle">
      <svg viewBox="0 0 16 16" width="13" height="13"><path fill="currentColor" d="M11.3 2.1a1.5 1.5 0 0 1 2.12 0l.48.48a1.5 1.5 0 0 1 0 2.12L6.75 11.85 3.5 12.5l.65-3.25zM10.6 3.86l1.54 1.54.9-.9a.5.5 0 0 0 0-.7l-.84-.84a.5.5 0 0 0-.7 0zM11.43 6.1 9.9 4.57 4.98 9.49l-.33 1.86 1.86-.33z"/></svg>
    </button>
    <input id="titleInput" type="text" spellcheck="false" class="hidden" data-i18n-ph="group.titlePlaceholder">
    <div id="gdrag"></div>
    <div class="tb-group">
      <button id="gnewBtn" class="tb-btn" data-i18n-title="tt.new">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M7.25 2h1.5v5.25H14v1.5H8.75V14h-1.5V8.75H2v-1.5h5.25z"/></svg>
      </button>
      <button id="gcolorBtn" class="tb-btn" data-i18n-title="tt.color">
        <span id="gcolorDot" class="color-dot"></span>
      </button>
      <button id="layoutGridBtn" class="tb-btn" data-i18n-title="tt.layoutGrid">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2 2h5.5v5.5H2zm6.5 0H14v5.5H8.5zM2 8.5h5.5V14H2zm6.5 0H14V14H8.5z"/></svg>
      </button>
      <button id="layoutMasonryBtn" class="tb-btn" data-i18n-title="tt.layoutMasonry">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2 2h5.5v8H2zm6.5 0H14v4.5H8.5zM2 11h5.5v3H2zm6.5-3.5H14V14H8.5z"/></svg>
      </button>
      <button id="layoutListBtn" class="tb-btn" data-i18n-title="tt.layoutList">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2 2.5h12v3H2zm0 4h12v3H2zm0 4h12v3H2z"/></svg>
      </button>
      <div id="gsizeSeg" class="hidden">
        <button id="gsizeS" data-i18n-title="tt.gridSizeS">S</button>
        <button id="gsizeM" data-i18n-title="tt.gridSizeM">M</button>
        <button id="gsizeL" data-i18n-title="tt.gridSizeL">L</button>
      </div>
      <button id="gdeleteBtn" class="tb-btn" data-i18n-title="tt.groupDelete">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M6 2h4l.5 1H14v1.5H2V3h3.5zM3 6h10l-.8 8.2c-.1.5-.5.8-1 .8H4.8c-.5 0-.9-.3-1-.8z"/></svg>
      </button>
      <button id="ghideBtn" class="tb-btn" data-i18n-title="tt.hide">
        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3.05 2 8 6.95 12.95 2 14 3.05 9.05 8 14 12.95 12.95 14 8 9.05 3.05 14 2 12.95 6.95 8 2 3.05z"/></svg>
      </button>
    </div>
    <div id="gnewMenu" class="hidden">
      <button data-newtype="rich" data-i18n="menu.newRich"></button>
      <button data-newtype="markdown" data-i18n="menu.newMarkdown"></button>
      <button data-newtype="file" data-i18n="menu.newFile"></button>
      <button data-newtype="web" data-i18n="menu.newWeb"></button>
      <button data-newtype="pdf" data-i18n="menu.newPdf"></button>
      <button data-newtype="group" data-i18n="menu.newGroup"></button>
    </div>
    <div id="gcolorPopover" class="hidden">
      <div id="gcolorGrid"></div>
      <div class="gcolor-row">
        <label for="gcolorCustom" data-i18n="color.custom"></label>
        <input type="color" id="gcolorCustom">
      </div>
      <div class="gcolor-row">
        <label for="gopacityRange" data-i18n="color.opacity"></label>
        <input type="range" id="gopacityRange" min="0" max="100" step="5">
        <span id="gopacityVal"></span>
      </div>
      <div class="gcolor-row">
        <button id="gcolorResetBtn" data-i18n="color.reset"></button>
      </div>
    </div>
  </header>

  <div id="cards" class="grid"></div>
  <div id="emptyHint" class="hidden"><span data-i18n="group.empty"></span></div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/common/bridge.js"></script>
  <script src="/common/i18n.js"></script>
  <script src="/common/color.js"></script>
  <script src="/editor/editor.js"></script>
  <script src="/editor/media.js"></script>
  <script src="/editor/markdown.js"></script>
  <script src="/group.js"></script>
</body>
</html>
